<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off · Matthew Prall</title>
  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fbf8f3;
      --ink: #1c1916;
      --muted: #5c564c;
      --accent: #8d3d22;
      --enamel: #1d3f3b;
      --serif: "Newsreader", Georgia, serif;
      --sans: system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121311;
        --surface: #1c1e1b;
        --ink: #f4efe6;
        --muted: #c8c0b4;
        --accent: #f0b59a;
        --enamel: #9ed9ce;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2rem;
      line-height: 1.5;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 560;
      letter-spacing: -0.03em;
      margin: 0 0 0.4rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }
    .lede {
      color: var(--muted);
      margin: 0 0 1.25rem;
      text-align: center;
      max-width: 32rem;
      font-size: 0.95rem;
    }
    .tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .tabs button {
      min-height: 36px;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: transparent;
      color: var(--ink);
      font: 500 0.85rem/1 var(--sans);
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--enamel);
      color: #f6f3ec;
      border-color: var(--enamel);
    }
    .thumbs {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .thumbs img {
      width: 72px;
      height: 108px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #000;
    }
    .thumbs img.active {
      border-color: var(--accent);
    }
    .card-wrap {
      position: relative;
      width: min(88vw, 420px);
      aspect-ratio: 2 / 3;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(48, 36, 22, 0.14);
      background: #000;
      user-select: none;
      touch-action: none;
    }
    .under, .outline, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .under { background-size: cover; background-position: center; }
    .outline {
      pointer-events: none;
      background-size: cover;
      background-position: center;
      mix-blend-mode: lighten;
    }
    canvas { cursor: crosshair; }
    .controls {
      margin-top: 1.25rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      min-height: 40px;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--enamel);
      background: var(--enamel);
      color: #f6f3ec;
      font: 500 0.92rem/1 var(--sans);
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--muted);
    }
    .hint {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    .percent {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }
    .celebrate {
      position: fixed;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 600;
      color: var(--accent);
      pointer-events: none;
      z-index: 11;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .celebrate.show { opacity: 1; }
    canvas#confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Scratch-Off</h1>
  <p class="lede">White outlines stay visible. Scratch the black to reveal the colors.</p>

  <div class="tabs" id="tabs"></div>
  <div class="thumbs" id="thumbs"></div>

  <div class="card-wrap" id="card">
    <div class="under" id="under"></div>
    <canvas id="scratch"></canvas>
    <div class="outline" id="outline"></div>
  </div>

  <div class="controls">
    <button id="reset" type="button">Reset</button>
    <button id="clear" type="button" class="ghost">Reveal all</button>
  </div>
  <p class="hint">Scratched: <span class="percent" id="pct">0</span>%</p>
  <div class="celebrate" id="celebrate">You did it!</div>
  <canvas id="confetti"></canvas>

  <script>
    const art = {
      christmas: [
        { name: 'Snowman', outline: '/scratch-off/art/christmas/snowman-outline.jpg', color: '/scratch-off/art/christmas/snowman-color.jpg' },
        { name: 'Penguins', outline: '/scratch-off/art/christmas/penguins-outline.jpg', color: '/scratch-off/art/christmas/penguins-color.jpg' },
        { name: 'Tree', outline: '/scratch-off/art/christmas/tree-outline.jpg', color: '/scratch-off/art/christmas/tree-color.jpg' }
      ],
      halloween: [
        { name: 'Pumpkin', outline: '/scratch-off/art/halloween/pumpkin-outline.jpg', color: '/scratch-off/art/halloween/pumpkin-color.jpg' },
        { name: 'Witch', outline: '/scratch-off/art/halloween/witch-outline.jpg', color: '/scratch-off/art/halloween/witch-color.jpg' },
        { name: 'Cat', outline: '/scratch-off/art/halloween/cat-outline.jpg', color: '/scratch-off/art/halloween/cat-color.jpg' }
      ],
      thanksgiving: [
        { name: 'Turkey', outline: '/scratch-off/art/thanksgiving/turkey-outline.jpg', color: '/scratch-off/art/thanksgiving/turkey-color.jpg' }
      ],
      easter: [
        { name: 'Bunny', outline: '/scratch-off/art/easter/bunny-outline.jpg', color: '/scratch-off/art/easter/bunny-color.jpg' }
      ],
      valentines: [
        { name: 'Heart', outline: '/scratch-off/art/valentines/heart-outline.jpg', color: '/scratch-off/art/valentines/heart-color.jpg' }
      ]
    };

    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const confettiCanvas = document.getElementById('confetti');
    const confettiCtx = confettiCanvas.getContext('2d');
    const card = document.getElementById('card');
    const under = document.getElementById('under');
    const outlineEl = document.getElementById('outline');
    const pctEl = document.getElementById('pct');
    const celebrateEl = document.getElementById('celebrate');
    const tabsEl = document.getElementById('tabs');
    const thumbsEl = document.getElementById('thumbs');
    const BRUSH = 32;
    let currentHoliday = 'christmas';
    let currentIndex = 0;
    let celebrated = false;

    function buildTabs() {
      tabsEl.innerHTML = '';
      Object.keys(art).forEach(key => {
        const btn = document.createElement('button');
        btn.textContent = key.charAt(0).toUpperCase() + key.slice(1);
        btn.dataset.holiday = key;
        if (key === currentHoliday) btn.classList.add('active');
        btn.addEventListener('click', () => {
          currentHoliday = key;
          currentIndex = 0;
          celebrated = false;
          celebrateEl.classList.remove('show');
          buildTabs();
          buildThumbs();
          loadArt();
        });
        tabsEl.appendChild(btn);
      });
    }

    function buildThumbs() {
      thumbsEl.innerHTML = '';
      art[currentHoliday].forEach((item, i) => {
        const img = document.createElement('img');
        img.src = item.outline;
        img.alt = item.name;
        if (i === currentIndex) img.classList.add('active');
        img.addEventListener('click', () => {
          currentIndex = i;
          celebrated = false;
          celebrateEl.classList.remove('show');
          buildThumbs();
          loadArt();
        });
        thumbsEl.appendChild(img);
      });
    }

    function loadArt() {
      const item = art[currentHoliday][currentIndex];
      under.style.backgroundImage = `url(${item.color})`;
      outlineEl.style.backgroundImage = `url(${item.outline})`;
      paintCover();
      pctEl.textContent = '0';
    }

    function sizeCanvas() {
      const rect = card.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintCover();

      confettiCanvas.width = window.innerWidth * dpr;
      confettiCanvas.height = window.innerHeight * dpr;
      confettiCanvas.style.width = window.innerWidth + 'px';
      confettiCanvas.style.height = window.innerHeight + 'px';
      confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function paintCover() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    let drawing = false;
    let last = null;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    function clearCircle(x, y, r) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function scratchTo(p) {
      const r = BRUSH / 2;
      if (last) {
        const dx = p.x - last.x;
        const dy = p.y - last.y;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.ceil(dist / 2));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          clearCircle(last.x + dx * t, last.y + dy * t, r);
        }
      } else {
        clearCircle(p.x, p.y, r);
      }
      last = p;
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      last = null;
      scratchTo(pos(e));
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      scratchTo(pos(e));
      if (Math.random() < 0.1) updatePercent();
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      last = null;
      updatePercent();
    }

    function updatePercent() {
      try {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        const step = 16;
        for (let i = 3; i < data.length; i += step) {
          if (data[i] < 10) transparent++;
        }
        const sampled = Math.ceil(data.length / 4 / (step / 4));
        const pct = Math.min(100, Math.round((transparent / sampled) * 100));
        pctEl.textContent = pct;
        if (pct >= 100 && !celebrated) {
          celebrated = true;
          celebrate();
        }
      } catch (err) {}
    }

    const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e91e63', '#fff'];
    let particles = [];
    let animating = false;

    function spawnConfetti() {
      const w = window.innerWidth;
      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * w,
          y: -20 - Math.random() * 80,
          w: 6 + Math.random() * 8,
          h: 10 + Math.random() * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: 2 + Math.random() * 4,
          vx: (Math.random() - 0.5) * 3,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }
    }

    function drawConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.rot += p.vr;
        p.alpha -= 0.007;
        if (p.alpha <= 0) return;
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rot);
        confettiCtx.globalAlpha = Math.max(0, p.alpha);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      });
      particles = particles.filter(p => p.alpha > 0 && p.y < window.innerHeight + 40);
      if (particles.length) requestAnimationFrame(drawConfetti);
      else animating = false;
    }

    function celebrate() {
      celebrateEl.classList.add('show');
      setTimeout(() => celebrateEl.classList.remove('show'), 2000);
      if (!animating) {
        animating = true;
        spawnConfetti();
        requestAnimationFrame(drawConfetti);
      }
    }

    canvas.addEventListener('pointerdown', start);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', end);

    document.getElementById('reset').addEventListener('click', () => {
      paintCover();
      pctEl.textContent = '0';
      celebrated = false;
      celebrateEl.classList.remove('show');
    });
    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pctEl.textContent = '100';
      if (!celebrated) {
        celebrated = true;
        celebrate();
      }
    });

    window.addEventListener('resize', sizeCanvas);
    buildTabs();
    buildThumbs();
    loadArt();
    sizeCanvas();
  </script>
</body>
</html>
