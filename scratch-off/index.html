<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off · Matthew Prall</title>
  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fbf8f3;
      --ink: #1c1916;
      --muted: #5c564c;
      --accent: #8d3d22;
      --enamel: #1d3f3b;
      --serif: "Newsreader", Georgia, serif;
      --sans: system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121311;
        --surface: #1c1e1b;
        --ink: #f4efe6;
        --muted: #c8c0b4;
        --accent: #f0b59a;
        --enamel: #9ed9ce;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 560;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    .lede {
      color: var(--muted);
      margin: 0 0 2rem;
      text-align: center;
      max-width: 36rem;
    }
    .card-wrap {
      position: relative;
      width: min(90vw, 420px);
      aspect-ratio: 3 / 2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(48, 36, 22, 0.12);
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      user-select: none;
      touch-action: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .under {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 30% 30%, #ff6b6b, transparent 50%),
        radial-gradient(circle at 70% 60%, #4ecdc4, transparent 50%),
        radial-gradient(circle at 50% 80%, #ffe66d, transparent 40%),
        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: var(--serif);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 560;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      min-height: 44px;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--enamel);
      background: var(--enamel);
      color: #f6f3ec;
      font: 500 0.98rem/1 var(--sans);
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--muted);
    }
    button:hover { filter: brightness(0.95); }
    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
    .percent {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Scratch-Off</h1>
  <p class="lede">Drag or rub to scratch away the black coating and reveal what’s underneath. Works with mouse or finger.</p>

  <div class="card-wrap" id="card">
    <div class="under" id="under">
      You found it.<br>Nice scratch.
    </div>
    <canvas id="scratch"></canvas>
  </div>

  <div class="controls">
    <button id="reset" type="button">Reset card</button>
    <button id="clear" type="button" class="ghost">Reveal all</button>
  </div>
  <p class="hint">Scratched: <span class="percent" id="pct">0</span>%</p>

  <script>
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const card = document.getElementById('card');
    const pctEl = document.getElementById('pct');
    const BRUSH = 28;

    function sizeCanvas() {
      const rect = card.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintCover();
    }

    function paintCover() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle metallic sheen lines so it feels like foil
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let y = 0; y < canvas.height; y += 6) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    let drawing = false;
    let last = null;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: t.clientX - rect.left,
        y: t.clientY - rect.top
      };
    }

    function scratchTo(p) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = BRUSH;
      if (last) {
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, BRUSH / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      last = p;
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      last = null;
      scratchTo(pos(e));
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      scratchTo(pos(e));
      if (Math.random() < 0.15) updatePercent();
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      last = null;
      updatePercent();
    }

    function updatePercent() {
      try {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        const step = 16;
        for (let i = 3; i < data.length; i += step) {
          if (data[i] < 32) transparent++;
        }
        const sampled = Math.ceil(data.length / 4 / (step / 4));
        const pct = Math.min(100, Math.round((transparent / sampled) * 100));
        pctEl.textContent = pct;
        if (pct > 62) {
          setTimeout(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pctEl.textContent = 100;
          }, 200);
        }
      } catch (err) {}
    }

    canvas.addEventListener('pointerdown', start);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);

    canvas.addEventListener('touchstart', start, { passive: false });
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', end);

    document.getElementById('reset').addEventListener('click', () => {
      paintCover();
      pctEl.textContent = '0';
    });
    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pctEl.textContent = '100';
    });

    window.addEventListener('resize', sizeCanvas);
    sizeCanvas();
  </script>
</body>
</html>
