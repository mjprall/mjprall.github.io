<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off · Matthew Prall</title>
  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fbf8f3;
      --ink: #1c1916;
      --muted: #5c564c;
      --accent: #8d3d22;
      --enamel: #1d3f3b;
      --serif: "Newsreader", Georgia, serif;
      --sans: system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121311;
        --surface: #1c1e1b;
        --ink: #f4efe6;
        --muted: #c8c0b4;
        --accent: #f0b59a;
        --enamel: #9ed9ce;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 560;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }
    .lede {
      color: var(--muted);
      margin: 0 0 1.5rem;
      text-align: center;
      max-width: 36rem;
    }
    .picker {
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    select {
      min-height: 44px;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--muted);
      background: var(--surface);
      color: var(--ink);
      font: 500 0.95rem/1 var(--sans);
    }
    .card-wrap {
      position: relative;
      width: min(90vw, 480px);
      aspect-ratio: 3 / 2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(48, 36, 22, 0.12);
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
      user-select: none;
      touch-action: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .under {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      min-height: 44px;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--enamel);
      background: var(--enamel);
      color: #f6f3ec;
      font: 500 0.98rem/1 var(--sans);
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--muted);
    }
    button:hover { filter: brightness(0.95); }
    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }
    .percent {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>Scratch-Off</h1>
  <p class="lede">Pick a holiday, then scratch. The area you touch clears fully and shows the image at full brightness.</p>

  <div class="picker">
    <label for="theme">Reveal:</label>
    <select id="theme">
      <option value="christmas">Christmas</option>
      <option value="halloween">Halloween</option>
      <option value="thanksgiving">Thanksgiving</option>
      <option value="easter">Easter</option>
      <option value="valentines">Valentine’s</option>
      <option value="july4">July 4th</option>
      <option value="newyear">New Year</option>
    </select>
  </div>

  <div class="card-wrap" id="card">
    <div class="under" id="under"></div>
    <canvas id="scratch"></canvas>
  </div>

  <div class="controls">
    <button id="reset" type="button">Reset card</button>
    <button id="clear" type="button" class="ghost">Reveal all</button>
  </div>
  <p class="hint">Scratched: <span class="percent" id="pct">0</span>%</p>

  <script>
    const canvas = document.getElementById('scratch');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const card = document.getElementById('card');
    const under = document.getElementById('under');
    const pctEl = document.getElementById('pct');
    const themeSelect = document.getElementById('theme');
    const BRUSH = 28;

    const themes = {
      christmas: '/scratch-off/images/christmas.jpg',
      halloween: '/scratch-off/images/halloween.jpg',
      thanksgiving: '/scratch-off/images/thanksgiving.jpg',
      easter: '/scratch-off/images/easter.jpg',
      valentines: '/scratch-off/images/valentines.jpg',
      july4: '/scratch-off/images/july4.jpg',
      newyear: '/scratch-off/images/newyear.jpg'
    };

    function setTheme(key) {
      under.style.backgroundImage = `url(${themes[key] || themes.christmas})`;
    }

    function sizeCanvas() {
      const rect = card.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintCover();
    }

    function paintCover() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    let drawing = false;
    let last = null;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    function clearCircle(x, y, r) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function scratchTo(p) {
      const r = BRUSH / 2;
      if (last) {
        const dx = p.x - last.x;
        const dy = p.y - last.y;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.ceil(dist / 2));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          clearCircle(last.x + dx * t, last.y + dy * t, r);
        }
      } else {
        clearCircle(p.x, p.y, r);
      }
      last = p;
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      last = null;
      scratchTo(pos(e));
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      scratchTo(pos(e));
      if (Math.random() < 0.12) updatePercent();
    }
    function end() {
      if (!drawing) return;
      drawing = false;
      last = null;
      updatePercent();
    }

    function updatePercent() {
      try {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        const step = 16;
        for (let i = 3; i < data.length; i += step) {
          if (data[i] < 10) transparent++;
        }
        const sampled = Math.ceil(data.length / 4 / (step / 4));
        const pct = Math.min(100, Math.round((transparent / sampled) * 100));
        pctEl.textContent = pct;
      } catch (err) {}
    }

    canvas.addEventListener('pointerdown', start);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', end);

    document.getElementById('reset').addEventListener('click', () => {
      paintCover();
      pctEl.textContent = '0';
    });
    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pctEl.textContent = '100';
    });

    themeSelect.addEventListener('change', () => {
      setTheme(themeSelect.value);
      paintCover();
      pctEl.textContent = '0';
    });

    window.addEventListener('resize', sizeCanvas);
    setTheme(themeSelect.value);
    sizeCanvas();
  </script>
</body>
</html>
